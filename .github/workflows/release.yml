name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Secrets and Keystores
        run: |
          touch .env
          echo "GEMINI_API_KEY=" >> .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, OU=Android, O=Google, L=Mountain View, S=California, C=US"
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=ApexStride, OU=App, O=Apex, L=City, S=State, C=ID" || true
          fi
          chmod +x gradlew || true

      - name: Build Release APK
        run: |
          STORE_PASSWORD=password KEY_PASSWORD=password ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Find and Prepare APK
        id: apk_finder
        run: |
          mkdir -p release_apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_apks/ \;
          echo "Found APK files:"
          ls -la release_apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: release_apks/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: release_apks/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: "ApexStride APK v1.0.${{ github.run_number }}"
          make_latest: true
          body: |
            ## 🏃‍♂️ ApexStride APK Release (v1.0.${{ github.run_number }})
            
            Aplikasi pelacak lari atletik modern:
            - **Peta Asli & Heatmap Satelit**: Peta jalan & citra satelit bumi asli dengan visualisasi rute interaktif.
            - **Pelacakan GPS Presisi**: Menghitung jarak, pace, split waktu, dan elevasi.
            - **Analisis Kinerja Atletik**: Konsistensi pace, estimasi VO2 Max, dan zona detak jantung.
            - **Penyimpanan Lokal & Privat**: Data tersimpan aman di perangkat via Room Database.
            
            Unduh file `.apk` di bawah dan pasang di perangkat Android Anda.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
