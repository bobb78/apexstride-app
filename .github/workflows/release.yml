name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Create Dummy Secrets and Keystore
        run: |
          touch .env
          echo "GEMINI_API_KEY=" >> .env
          keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=ApexStride, OU=App, O=Apex, L=City, S=State, C=ID" || true

      - name: Build Debug & Release APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          STORE_PASSWORD=password KEY_PASSWORD=password ./gradlew assembleRelease --stacktrace --no-daemon || true

      - name: Find and Prepare APK
        id: apk_finder
        run: |
          mkdir -p release_apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_apks/ \;
          echo "Found APK files:"
          ls -la release_apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: release_apks/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: release_apks/*.apk
          tag_name: ${{ github.ref_name }}
          name: "ApexStride Release ${{ github.ref_name }}"
          body: |
            ## 🏃‍♂️ ApexStride APK Release
            
            Aplikasi pelacak lari atletik modern:
            - **Peta Asli & Heatmap Satelit**: Peta jalan & citra satelit bumi asli dengan visualisasi rute interaktif.
            - **Pelacakan GPS Presisi**: Menghitung jarak, pace, split waktu, dan elevasi.
            - **Analisis Kinerja Atletik**: Konsistensi pace, estimasi VO2 Max, dan zona detak jantung.
            - **Penyimpanan Lokal & Privat**: Data tersimpan aman di perangkat via Room Database.
            
            Unduh file `.apk` di bawah dan pasang di perangkat Android Anda.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
